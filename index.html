<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Sistema de gestión para laboratorio dental">
  <link rel="manifest" href="./manifest.json">

  <title>LAB innovadent</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    header {
      background: #0f766e;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 6px 0 0;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      padding: 12px;
      background: white;
      box-shadow: 0 2px 5px rgba(0,0,0,.1);
    }

    nav button {
      border: none;
      background: #0f766e;
      color: white;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    nav button:hover {
      opacity: .9;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .seccion {
      display: none;
    }

    .seccion.activa {
      display: block;
    }

    .tarjetas {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin: 20px 0;
    }

    .tarjeta {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 7px rgba(0,0,0,.08);
      text-align: center;
    }

    .tarjeta h3 {
      margin: 0;
      font-size: 30px;
      color: #0f766e;
    }

    .formulario {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 7px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }

    .campo {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .boton {
      border: none;
      padding: 11px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 5px;
    }

    .verde {
      background: #0f766e;
      color: white;
    }

    .azul {
      background: #2563eb;
      color: white;
    }

    .rojo {
      background: #dc2626;
      color: white;
    }

    .whatsapp {
      background: #25d366;
      color: white;
    }

    .lista {
      display: grid;
      gap: 15px;
    }

    .item {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 7px rgba(0,0,0,.08);
    }

    .item h3 {
      margin-top: 0;
      color: #0f766e;
    }

    .estado {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      margin: 5px 0;
    }

    .recibido {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .proceso {
      background: #fef3c7;
      color: #92400e;
    }

    .terminado {
      background: #dcfce7;
      color: #166534;
    }

    .entregado {
      background: #e0e7ff;
      color: #3730a3;
    }

    .aviso {
      background: #fff7ed;
      border-left: 5px solid #f97316;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .vacio {
      text-align: center;
      color: #64748b;
      padding: 20px;
    }

    .dos-columnas {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    @media (max-width: 600px) {
      main {
        padding: 12px;
      }

      header h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>LAB innovadent</h1>
  <p>Gestión del laboratorio dental</p>
</header>

<nav>
  <button onclick="mostrarSeccion('inicio')">Inicio</button>
  <button onclick="mostrarSeccion('clientes')">Clientes</button>
  <button onclick="mostrarSeccion('trabajos')">Trabajos</button>
  <button onclick="mostrarSeccion('citas')">Citas</button>
  <button onclick="mostrarSeccion('nuevoTrabajo')">Nuevo trabajo</button>
  <button onclick="mostrarSeccion('nuevaCita')">Nueva cita</button>
</nav>

<main>

  <!-- INICIO -->
  <section id="inicio" class="seccion activa">

    <h2>Panel principal</h2>

    <div class="tarjetas">
      <div class="tarjeta">
        <h3 id="totalClientes">0</h3>
        <p>Clientes</p>
      </div>

      <div class="tarjeta">
        <h3 id="totalTrabajos">0</h3>
        <p>Trabajos</p>
      </div>

      <div class="tarjeta">
        <h3 id="trabajosProceso">0</h3>
        <p>En proceso</p>
      </div>

      <div class="tarjeta">
        <h3 id="totalCitas">0</h3>
        <p>Citas</p>
      </div>
    </div>

    <h2>📅 Citas de mañana</h2>
    <div id="avisosCitas"></div>

  </section>


  <!-- CLIENTES -->
  <section id="clientes" class="seccion">

    <h2>Clientes</h2>

    <div class="formulario">
      <div class="dos-columnas">

        <div class="campo">
          <label>Clínica</label>
          <input id="clienteClinica" type="text">
        </div>

        <div class="campo">
          <label>Dr. / Dra.</label>
          <input id="clienteDoctor" type="text">
        </div>

        <div class="campo">
          <label>Paciente</label>
          <input id="clientePaciente" type="text">
        </div>

        <div class="campo">
          <label>Teléfono</label>
          <input id="clienteTelefono" type="tel">
        </div>

        <div class="campo">
          <label>Correo</label>
          <input id="clienteCorreo" type="email">
        </div>

      </div>

      <button class="boton verde" onclick="guardarCliente()">
        Guardar cliente
      </button>
    </div>

    <div id="listaClientes" class="lista"></div>

  </section>


  <!-- TRABAJOS -->
  <section id="trabajos" class="seccion">

    <h2>Trabajos</h2>

    <div id="listaTrabajos" class="lista"></div>

  </section>


  <!-- NUEVO TRABAJO -->
  <section id="nuevoTrabajo" class="seccion">

    <h2>Nuevo trabajo</h2>

    <div class="formulario">

      <div class="dos-columnas">

        <div class="campo">
          <label>Clínica</label>
          <input id="trabajoClinica" type="text">
        </div>

        <div class="campo">
          <label>Dr. / Dra.</label>
          <input id="trabajoDoctor" type="text">
        </div>

        <div class="campo">
          <label>Paciente</label>
          <input id="trabajoPaciente" type="text">
        </div>

        <div class="campo">
          <label>Tipo de trabajo</label>
          <input id="trabajoTipo" type="text"
                 placeholder="Ejemplo: prótesis, corona, reparación">
        </div>

        <div class="campo">
          <label>Fecha de llegada</label>
          <input id="fechaLlegada" type="date">
        </div>

        <div class="campo">
          <label>Fecha de entrega</label>
          <input id="fechaEntrega" type="date">
        </div>

        <div class="campo">
          <label>Estado</label>
          <select id="estadoTrabajo">
            <option value="Recibido">Recibido</option>
            <option value="En proceso">En proceso</option>
            <option value="Terminado">Terminado</option>
            <option value="Entregado">Entregado</option>
          </select>
        </div>

        <div class="campo">
          <label>Monto</label>
          <input id="trabajoMonto" type="number" step="0.01">
        </div>

      </div>

      <div class="campo">
        <label>Observaciones</label>
        <textarea id="trabajoObservaciones"></textarea>
      </div>

      <button class="boton verde" onclick="guardarTrabajo()">
        Guardar trabajo
      </button>

    </div>

  </section>


  <!-- CITAS -->
  <section id="citas" class="seccion">

    <h2>📅 Citas de pacientes</h2>

    <p>
      Las citas son directamente con el mecánico dental
      <strong>Javier Quiroz</strong>.
    </p>

    <div id="listaCitas" class="lista"></div>

  </section>


  <!-- NUEVA CITA -->
  <section id="nuevaCita" class="seccion">

    <h2>➕ Nueva cita</h2>

    <div class="formulario">

      <div class="campo">
        <label>Nombre del paciente</label>
        <input id="citaPaciente" type="text"
               placeholder="Nombre completo">
      </div>

      <div class="campo">
        <label>Número de teléfono</label>
        <input id="citaTelefono" type="tel"
               placeholder="Ejemplo: 50761234567">
      </div>

      <div class="campo">
        <label>Fecha de la cita</label>
        <input id="citaFecha" type="date">
      </div>

      <div class="campo">
        <label>Hora de la cita</label>
        <input id="citaHora" type="time">
      </div>

      <button class="boton verde" onclick="guardarCita()">
        Guardar cita
      </button>

    </div>

  </section>

</main>


<script>

  // =========================
  // DATOS
  // =========================

  let clientes = JSON.parse(
    localStorage.getItem("lab_clientes") || "[]"
  );

  let trabajos = JSON.parse(
    localStorage.getItem("lab_trabajos") || "[]"
  );

  let citas = JSON.parse(
    localStorage.getItem("lab_citas") || "[]"
  );


  // =========================
  // NAVEGACIÓN
  // =========================

  function mostrarSeccion(id) {

    document.querySelectorAll(".seccion")
      .forEach(seccion => {
        seccion.classList.remove("activa");
      });

    document.getElementById(id)
      .classList.add("activa");

    actualizarTodo();
  }


  // =========================
  // CLIENTES
  // =========================

  function guardarCliente() {

    const cliente = {
      id: Date.now(),
      clinica: document.getElementById("clienteClinica").value,
      doctor: document.getElementById("clienteDoctor").value,
      paciente: document.getElementById("clientePaciente").value,
      telefono: document.getElementById("clienteTelefono").value,
      correo: document.getElementById("clienteCorreo").value
    };

    if (!cliente.paciente) {
      alert("Escribe el nombre del paciente.");
      return;
    }

    clientes.push(cliente);

    localStorage.setItem(
      "lab_clientes",
      JSON.stringify(clientes)
    );

    alert("Cliente guardado.");

    document.getElementById("clienteClinica").value = "";
    document.getElementById("clienteDoctor").value = "";
    document.getElementById("clientePaciente").value = "";
    document.getElementById("clienteTelefono").value = "";
    document.getElementById("clienteCorreo").value = "";

    actualizarTodo();
  }


  function mostrarClientes() {

    const contenedor =
      document.getElementById("listaClientes");

    if (clientes.length === 0) {
      contenedor.innerHTML =
        '<div class="vacio">No hay clientes registrados.</div>';
      return;
    }

    contenedor.innerHTML = clientes.map(cliente => `

      <div class="item">

        <h3>${escapar(cliente.paciente)}</h3>

        <p><strong>Clínica:</strong>
        ${escapar(cliente.clinica || "-")}</p>

        <p><strong>Dr./Dra.:</strong>
        ${escapar(cliente.doctor || "-")}</p>

        <p><strong>Teléfono:</strong>
        ${escapar(cliente.telefono || "-")}</p>

        <p><strong>Correo:</strong>
        ${escapar(cliente.correo || "-")}</p>

        <button class="boton rojo"
          onclick="eliminarCliente(${cliente.id})">
          Eliminar
        </button>

      </div>

    `).join("");
  }


  function eliminarCliente(id) {

    if (!confirm("¿Eliminar este cliente?")) return;

    clientes = clientes.filter(c => c.id !== id);

    localStorage.setItem(
      "lab_clientes",
      JSON.stringify(clientes)
    );

    actualizarTodo();
  }


  // =========================
  // TRABAJOS
  // =========================

  function guardarTrabajo() {

    const trabajo = {

      id: Date.now(),

      clinica:
        document.getElementById("trabajoClinica").value,

      doctor:
        document.getElementById("trabajoDoctor").value,

      paciente:
        document.getElementById("trabajoPaciente").value,

      tipo:
        document.getElementById("trabajoTipo").value,

      fechaLlegada:
        document.getElementById("fechaLlegada").value,

      fechaEntrega:
        document.getElementById("fechaEntrega").value,

      estado:
        document.getElementById("estadoTrabajo").value,

      monto:
        document.getElementById("trabajoMonto").value,

      observaciones:
        document.getElementById("trabajoObservaciones").value
    };


    if (!trabajo.paciente || !trabajo.tipo) {

      alert(
        "Escribe al menos el paciente y el tipo de trabajo."
      );

      return;
    }


    trabajos.push(trabajo);

    localStorage.setItem(
      "lab_trabajos",
      JSON.stringify(trabajos)
    );


    alert("Trabajo guardado correctamente.");

    document.getElementById("trabajoClinica").value = "";
    document.getElementById("trabajoDoctor").value = "";
    document.getElementById("trabajoPaciente").value = "";
    document.getElementById("trabajoTipo").value = "";
    document.getElementById("fechaLlegada").value = "";
    document.getElementById("fechaEntrega").value = "";
    document.getElementById("estadoTrabajo").value = "Recibido";
    document.getElementById("trabajoMonto").value = "";
    document.getElementById("trabajoObservaciones").value = "";

    actualizarTodo();
  }


  function claseEstado(estado) {

    if (estado === "Recibido") return "recibido";
    if (estado === "En proceso") return "proceso";
    if (estado === "Terminado") return "terminado";
    if (estado === "Entregado") return "entregado";

    return "recibido";
  }


  function mostrarTrabajos() {

    const contenedor =
      document.getElementById("listaTrabajos");


    if (trabajos.length === 0) {

      contenedor.innerHTML =
        '<div class="vacio">No hay trabajos registrados.</div>';

      return;
    }


    contenedor.innerHTML = trabajos.map(trabajo => `

      <div class="item">

        <h3>${escapar(trabajo.paciente)}</h3>

        <p>
          <strong>Trabajo:</strong>
          ${escapar(trabajo.tipo)}
        </p>

        <p>
          <strong>Clínica:</strong>
          ${escapar(trabajo.clinica || "-")}
        </p>

        <p>
          <strong>Dr./Dra.:</strong>
          ${escapar(trabajo.doctor || "-")}
        </p>

        <p>
          <strong>Llegó:</strong>
          ${trabajo.fechaLlegada || "-"}
        </p>

        <p>
          <strong>Entrega:</strong>
          ${trabajo.fechaEntrega || "-"}
        </p>

        <span class="estado ${claseEstado(trabajo.estado)}">
          ${trabajo.estado}
        </span>

        <p>
          <strong>Monto:</strong>
          $${trabajo.monto || "0.00"}
        </p>

        <p>
          <strong>Observaciones:</strong>
          ${escapar(trabajo.observaciones || "-")}
        </p>

        <button class="boton rojo"
          onclick="eliminarTrabajo(${trabajo.id})">
          Eliminar
        </button>

      </div>

    `).join("");
  }


  function eliminarTrabajo(id) {

    if (!confirm("¿Eliminar este trabajo?")) return;

    trabajos =
      trabajos.filter(t => t.id !== id);

    localStorage.setItem(
      "lab_trabajos",
      JSON.stringify(trabajos)
    );

    actualizarTodo();
  }


  // =========================
  // CITAS
  // =========================

  function guardarCita() {

    const paciente =
      document.getElementById("citaPaciente").value.trim();

    const telefono =
      document.getElementById("citaTelefono").value.trim();

    const fecha =
      document.getElementById("citaFecha").value;

    const hora =
      document.getElementById("citaHora").value;


    if (!paciente || !telefono || !fecha) {

      alert(
        "Necesitas escribir el nombre, teléfono y fecha."
      );

      return;
    }


    const cita = {

      id: Date.now(),

      paciente: paciente,

      telefono: telefono,

      fecha: fecha,

      hora: hora || ""

    };


    citas.push(cita);

    localStorage.setItem(
      "lab_citas",
      JSON.stringify(citas)
    );


    alert("Cita guardada correctamente.");

    document.getElementById("citaPaciente").value = "";
    document.getElementById("citaTelefono").value = "";
    document.getElementById("citaFecha").value = "";
    document.getElementById("citaHora").value = "";


    actualizarTodo();
  }


  function mostrarCitas() {

    const contenedor =
      document.getElementById("listaCitas");


    if (citas.length === 0) {

      contenedor.innerHTML =
        '<div class="vacio">No hay citas registradas.</div>';

      return;
    }


    const ordenadas = [...citas].sort(
      (a, b) =>
        new Date(a.fecha + "T" + (a.hora || "00:00")) -
        new Date(b.fecha + "T" + (b.hora || "00:00"))
    );


    contenedor.innerHTML =
      ordenadas.map(cita => `

      <div class="item">

        <h3>👤 ${escapar(cita.paciente)}</h3>

        <p>
          <strong>Teléfono:</strong>
          ${escapar(cita.telefono)}
        </p>

        <p>
          <strong>Fecha:</strong>
          ${formatearFecha(cita.fecha)}
        </p>

        <p>
          <strong>Hora:</strong>
          ${cita.hora || "No indicada"}
        </p>

        <button
          class="boton whatsapp"
          onclick="abrirWhatsApp('${escaparJS(cita.telefono)}','${escaparJS(cita.paciente)}','${cita.fecha}','${cita.hora}')">

          💬 Recordar por WhatsApp

        </button>

        <button
          class="boton rojo"
          onclick="eliminarCita(${cita.id})">

          Eliminar

        </button>

      </div>

    `).join("");
  }


  function eliminarCita(id) {

    if (!confirm("¿Eliminar esta cita?")) return;

    citas = citas.filter(c => c.id !== id);

    localStorage.setItem(
      "lab_citas",
      JSON.stringify(citas)
    );

    actualizarTodo();
  }


  // =========================
  // WHATSAPP
  // =========================

  function abrirWhatsApp(
    telefono,
    paciente,
    fecha,
    hora
  ) {

    let numero =
      telefono.replace(/\D/g, "");


    if (!numero) {

      alert("El número de teléfono no es válido.");

      return;
    }


    const fechaBonita =
      formatearFecha(fecha);


    let mensaje =
      "Hola " + paciente + ".%0A%0A" +

      "Le recordamos que tiene una cita " +
      "en LAB innovadent con Javier Quiroz " +

      "el día " + fechaBonita;


    if (hora) {

      mensaje +=
        " a las " + hora;

    }


    mensaje +=
      ".%0A%0APor favor confirme su asistencia.%0A%0A" +
      "Gracias.";


    const url =
      "https://wa.me/" +
      numero +
      "?text=" +
      mensaje;


    window.open(url, "_blank");
  }


  // =========================
  // AVISOS DE MAÑANA
  // =========================

  function obtenerFechaManana() {

    const fecha =
      new Date();

    fecha.setDate(
      fecha.getDate() + 1
    );

    const año =
      fecha.getFullYear();

    const mes =
      String(fecha.getMonth() + 1).padStart(2, "0");

    const dia =
      String(fecha.getDate()).padStart(2, "0");


    return año + "-" + mes + "-" + dia;
  }


  function mostrarAvisosCitas() {

    const contenedor =
      document.getElementById("avisosCitas");


    const manana =
      obtenerFechaManana();


    const citasManana =
      citas.filter(c => c.fecha === manana);


    if (citasManana.length === 0) {

      contenedor.innerHTML =
        '<div class="vacio">No hay citas para mañana.</div>';

      return;
    }


    contenedor.innerHTML =
      citasManana.map(cita => `

      <div class="aviso">

        <strong>
          📅 ${escapar(cita.paciente)}
        </strong>

        <br>

        Mañana tiene cita
        ${cita.hora
          ? " a las " + cita.hora
          : ""}.

        <br>

        <button
          class="boton whatsapp"
          onclick="abrirWhatsApp('${escaparJS(cita.telefono)}','${escaparJS(cita.paciente)}','${cita.fecha}','${cita.hora}')">

          💬 Enviar recordatorio

        </button>

      </div>

    `).join("");
  }


  // =========================
  // DASHBOARD
  // =========================

  function actualizarDashboard() {

    document.getElementById("totalClientes")
      .textContent = clientes.length;

    document.getElementById("totalTrabajos")
      .textContent = trabajos.length;

    document.getElementById("trabajosProceso")
      .textContent =
        trabajos.filter(
          t => t.estado === "En proceso"
        ).length;

    document.getElementById("totalCitas")
      .textContent = citas.length;

    mostrarAvisosCitas();
  }


  function actualizarTodo() {

    mostrarClientes();
    mostrarTrabajos();
    mostrarCitas();
    actualizarDashboard();
  }


  // =========================
  // FUNCIONES AUXILIARES
  // =========================

  function formatearFecha(fecha) {

    if (!fecha) return "-";

    const partes =
      fecha.split("-");

    if (partes.length !== 3)
      return fecha;

    return partes[2] + "/" +
           partes[1] + "/" +
           partes[0];
  }


  function escapar(texto) {

    return String(texto || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function escaparJS(texto) {

    return String(texto || "")
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");
  }


  // =========================
  // INICIO
  // =========================

  actualizarTodo();


  // =========================
  // SERVICE WORKER
  // =========================

  if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

      navigator.serviceWorker
        .register("./sw.js")

        .then(() => {

          console.log(
            "LAB innovadent: Service Worker registrado."
          );

        })

        .catch(error => {

          console.error(
            "Error registrando Service Worker:",
            error
          );

        });

    });

  }

</script>

</body>
</html>
